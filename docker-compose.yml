services:
  mark-bot:
    build:
      context: .
      dockerfile: Dockerfile
    image: animex/mark-bot:latest
    container_name: mark-bot
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
      - path: .env.local
        required: false
    volumes:
      - ./data:/data
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
